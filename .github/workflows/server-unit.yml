# Server unit suite — Fastify API (@devdigest/api), hermetic tests only.
#
# Two jobs:
#  - typecheck: type-check on Linux only — the platform CI and the exported
#    agent-runner both run on. We deliberately do NOT matrix over Windows/macOS:
#    macOS is covered by daily local dev, Windows is not a ship target, and
#    `@ast-grep/napi` is exact-pinned so its native binary only changes on a
#    deliberate version bump.
#  - unit: the ~19 DB-free test files (everything that is NOT `*.it.test.ts`).
#    LLM/git/embeddings are mocked via src/adapters/mocks.ts — no Docker.
#
# DB-backed tests run in server-integration.yml. reviewer-core/** is in the
# path filter because server aliases ../reviewer-core/src at type-check time.
name: server unit

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'
      - '!**/INSIGHTS.md'
  pull_request:
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'
      - '!**/INSIGHTS.md'

permissions:
  contents: read

concurrency:
  group: server-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # server/src/vendor/shared is server's own copy of the contracts;
      # client/src/vendor/shared is a physical copy of it, not an alias (see
      # client.yml's note on the same check). Catches a server-only PR that
      # edits a contract without updating client's copy, before this job
      # spends an install on it.
      - name: client/src/vendor/shared must match server's copy
        working-directory: ${{ github.workspace }}
        run: |
          diff -r client/src/vendor/shared server/src/vendor/shared || {
            echo "::error::client/src/vendor/shared has drifted from server/src/vendor/shared. Copy server's version over client's (both directories, contract-for-contract) and commit that."
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server type-checks reviewer-core's RAW source: tsconfig aliases
      # @devdigest/reviewer-core → ../reviewer-core/src, and platform/structured.ts
      # re-exports from it. That source imports `openai`/`zod`, so without
      # reviewer-core's deps installed, tsc fails with TS2307 → cascading
      # unknown→T errors. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - run: pnpm typecheck

  unit:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The unit tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # Inlined rather than `pnpm test:unit`: server/package.json is
      # skip-worktree (a local variant), so the committed package.json may
      # not carry the split scripts. Run vitest directly.
      - run: pnpm exec vitest run --exclude '**/*.it.test.ts'

      # Same reasoning as above — invoked directly (`pnpm exec`) rather than
      # via a package.json script, so it isn't at the mercy of the
      # skip-worktree gotcha either. The onion-architecture skill documents
      # every CRITICAL layering rule as "encoded here"; this step is what
      # makes that true rather than aspirational. `dependency-cruiser` is
      # already a server dependency (^17.4.3) — nothing extra to install.
      - name: Enforce backend layering (dependency-cruiser)
        run: pnpm exec depcruise src --config .dependency-cruiser.cjs
