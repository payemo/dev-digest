# mcp suite — the local MCP server (@devdigest/mcp) that exposes DevDigest to
# coding agents over stdio. Tests are hermetic units: the only outside world
# this package has is fetch, and it is stubbed. Uses npm (package-lock.json).
#
# server/src/vendor/shared/** is in the path filter because mcp/tsconfig.json
# aliases @devdigest/shared to it at type-check time — a contract change there
# can break this suite without ever touching mcp/.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'
      - '!**/INSIGHTS.md'
  pull_request:
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'
      - '!**/INSIGHTS.md'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
