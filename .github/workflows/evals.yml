# Harness evals (@devdigest/evals) — skills, subagents and the workflow tier, run on OpenRouter.
#
# What runs is decided by the diff (evals/scripts/ci-detect.mjs):
#   .claude/skills/<n>/**  or evals/skills/<n>/**   -> evals/skills/<n>      (content tier, no proxy)
#   .claude/agents/<n>.md  or evals/agents/<n>/**   -> evals/agents/<n>      (tool tier, LiteLLM proxy)
#   any CLAUDE.md / any agent / evals/workflow|src  -> evals/workflow        (tool tier, LiteLLM proxy)
# An artifact with no written evals (or whose evals have lost their artifact) is NOT a failure:
# it is logged as "SKIP <name> (...)" in the detect step and on the run summary page.
#
# Models are switchable without touching code (first non-empty wins):
#   workflow_dispatch input  >  repo variable (Settings -> Variables -> Actions)  >  default below
#     skills + agents : EVAL_MODEL            default deepseek/deepseek-v4-flash
#     workflow tier   : EVAL_WORKFLOW_MODEL   default google/gemini-2.5-flash  (the one verified to
#                                             dispatch subagents — see evals/README.md)
#     LLM judge       : EVAL_JUDGE_MODEL      default google/gemini-2.5-flash  (other family than the
#                                             task model, softens self-preference)
#
# Blocking: the model-backed jobs are REPORT-ONLY by default (cheap models flake on some cases —
# see evals/README.md). Set repo variable EVAL_BLOCKING=true to make them fail the run.
#
# Requires the repo Actions secret OPENROUTER_API_KEY. Secrets are not exposed to PRs from forks,
# so those runs are skipped (with a notice) rather than failed.
#
# Manual run: Actions -> evals -> Run workflow (scope=all runs every artifact that has evals).
# Needs this file on the default branch to show up in the UI; before that, open a PR.
name: evals

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '**/CLAUDE.md'
      - 'evals/**'
      - '.github/workflows/evals.yml'
      - '!**/INSIGHTS.md'
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed = like a PR (diff vs main); all = every artifact that has evals'
        type: choice
        options: [changed, all]
        default: all
      model:
        description: 'Model for skills + agents evals (OpenRouter slug). Empty = repo var / default'
        type: string
        default: ''
      workflow_model:
        description: 'Model for the workflow tier (OpenRouter slug). Empty = repo var / default'
        type: string
        default: ''
      judge_model:
        description: 'LLM-judge model (OpenRouter slug). Empty = repo var / default'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'deepseek/deepseek-v4-flash' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'google/gemini-2.5-flash' }}
  WORKFLOW_MODEL: ${{ inputs.workflow_model || vars.EVAL_WORKFLOW_MODEL || 'google/gemini-2.5-flash' }}

defaults:
  run:
    working-directory: evals

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    # Fork PRs have no secrets -> nothing could run. Skip quietly instead of going red.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
      quality_skills: ${{ steps.detect.outputs.quality_skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed files
        id: diff
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # ACMR: skip deleted files — an artifact that no longer exists has nothing to evaluate.
            files="$(git diff --name-only --diff-filter=ACMR "$base"...HEAD)"
          else
            files="$(git diff --name-only --diff-filter=ACMR origin/${{ github.event.repository.default_branch }}...HEAD || true)"
          fi
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Detect eval suites
        id: detect
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          EVAL_ALL: ${{ inputs.scope == 'all' && '1' || '0' }}
        run: node scripts/ci-detect.mjs

      - name: Models in use
        run: |
          echo "skills/agents model : $EVAL_MODEL"
          echo "workflow model      : $WORKFLOW_MODEL"
          echo "judge model         : $EVAL_JUDGE_MODEL"
          {
            echo '### Models'
            echo "- skills + agents: \`$EVAL_MODEL\`"
            echo "- workflow tier: \`$WORKFLOW_MODEL\`"
            echo "- judge: \`$EVAL_JUDGE_MODEL\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deterministic gate (no model, no key): types, SKILL.md structure of the CHANGED skills only
  # (the whole catalog includes vendored skills with their own lint debt), the stats-math tests.
  static:
    name: static
    needs: detect
    if: needs.detect.outputs.skills != '[]' || needs.detect.outputs.agents != '[]' || needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: SKILL.md structure (changed skills)
        if: needs.detect.outputs.quality_skills != ''
        run: pnpm eval:quality ${{ needs.detect.outputs.quality_skills }}
      - run: pnpm exec vitest run src/

  # Content tier: skillTask + judge talk to OpenRouter directly (OpenAI format) — no proxy needed.
  skills:
    name: skill / ${{ matrix.skill }}
    needs: [detect, static]
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.EVAL_BLOCKING != 'true' }} # report-only until the evals are stable
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2 # OpenRouter throttles bursts; keep concurrency low
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run skill evals
        run: pnpm exec vitest run "skills/${{ matrix.skill }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-skill-${{ matrix.skill }}
          path: evals/results/
          if-no-files-found: ignore

  # Tool tiers: the Agent SDK speaks the Anthropic protocol, so non-Anthropic models go through
  # the bundled LiteLLM proxy (evals/proxy). One proxy per job.
  agents:
    name: agent / ${{ matrix.agent }}
    needs: [detect, static]
    if: needs.detect.outputs.agents != '[]'
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.EVAL_BLOCKING != 'true' }} # report-only until the evals are stable
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        agent: ${{ fromJSON(needs.detect.outputs.agents) }}
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - name: Run agent evals
        run: pnpm exec vitest run "agents/${{ matrix.agent }}"
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-agent-${{ matrix.agent }}
          path: evals/results/
          if-no-files-found: ignore

  # Systemic tier: real CLAUDE.md + skills + subagents. Needs a model that actually dispatches
  # subagents, hence its own model knob (Gemini Flash by default).
  workflow:
    name: workflow
    needs: [detect, static]
    if: needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.EVAL_BLOCKING != 'true' }} # report-only until the evals are stable
    timeout-minutes: 30
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - name: Run workflow evals
        env:
          EVAL_MODEL: ${{ env.WORKFLOW_MODEL }}
        run: pnpm exec vitest run workflow
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-workflow
          path: evals/results/
          if-no-files-found: ignore
